name: Move Issue to In Review
on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  move-to-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Extract Issue Number
        id: info
        run: |
          # Беремо назву гілки, з якої йде PR
          BRANCH="${{ github.event.pull_request.head.ref }}"
          ISSUE_NUM=$(echo $BRANCH | grep -oP '^\d+')
          echo "num=$ISSUE_NUM" >> $GITHUB_OUTPUT

      - name: Move Issue to In Review
        if: steps.info.outputs.num != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ORG: "pinterest-clone-project"
          PROJECT_NUMBER: 1
          ISSUE_NUMBER: ${{ steps.info.outputs.num }}
          REPO: ${{ github.event.repository.name }}
        run: |
          ISSUE_ID=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $num: Int!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $num) { id }
              }
            }' \
            -f owner="$ORG" \
            -f repo="$REPO" \
            -F num=$ISSUE_NUMBER \
            --jq '.data.repository.issue.id')

          PROJECT_DATA=$(gh api graphql -f query='
            query($org: String!, $num: Int!) {
              organization(login: $org) {
                projectV2(number: $num) {
                  id
                  field(name: "Status") {
                    ... on ProjectV2SingleSelectField {
                      id
                      options { id name }
                    }
                  }
                }
              }
            }' \
            -f org="$ORG" \
            -F num=$PROJECT_NUMBER)

          PROJECT_ID=$(echo $PROJECT_DATA | jq -r '.data.organization.projectV2.id')
          FIELD_ID=$(echo $PROJECT_DATA | jq -r '.data.organization.projectV2.field.id')
          OPTION_ID=$(echo $PROJECT_DATA | jq -r '.data.organization.projectV2.field.options[] | select(.name == "In review") | .id')

          ITEM_ID=$(gh api graphql -f query='
            mutation($project: ID!, $content: ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $content}) {
                item { id }
              }
            }' \
            -f project="$PROJECT_ID" \
            -f content="$ISSUE_ID" \
            --jq '.data.addProjectV2ItemById.item.id')

          gh api graphql -f query='
            mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project,
                itemId: $item,
                fieldId: $field,
                value: { singleSelectOptionId: $option }
              }) {
                projectV2Item { id }
              }
            }' \
            -f project="$PROJECT_ID" \
            -f item="$ITEM_ID" \
            -f field="$FIELD_ID" \
            -f option="$OPTION_ID"

          echo "Done! Issue #$ISSUE_NUMBER moved to In Review"
