name: Deploy to AWS
on:
  pull_request:
    branches: [ main ]
    types: [ closed ]
jobs:
  build-and-deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and Push Docker Images
      run: |
        cd frontend-pinterest
        docker build --build-arg VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }} --build-arg VITE_APP_IMAGE_URL=${{ secrets.VITE_APP_IMAGE_URL }} --build-arg VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }} -t esthetic-web .
        docker tag esthetic-web:latest jacobs51/esthetic-web:latest
        docker push jacobs51/esthetic-web:latest
        cd ../backend-pinterest
        docker build -t esthetic-api .
        docker tag esthetic-api:latest jacobs51/esthetic-api:latest
        docker push jacobs51/esthetic-api:latest
        
    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /var/www/esthetic
          docker compose pull
          docker compose up -d